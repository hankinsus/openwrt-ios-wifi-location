[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ios-wifi-loc"
version = "0.4.4"
description = "Linux-side controller for iPhone Wi-Fi developer location simulation via pymobiledevice3."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "ios-wifi-loc contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ios-wifi-loc = "ios_wifi_loc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "upstream: invokes an installed pymobiledevice3 binary; skipped when it is not on PATH",
]
addopts = "-q"
